name: Deploy static editor to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Verifica che i secret necessari siano impostati
        run: |
          if [ -z "${{ secrets.SITE_PASSWORD_HASH }}" ]; then
            echo "::error::Secret SITE_PASSWORD_HASH mancante — impostalo in Settings > Secrets and variables > Actions prima di rilanciare il deploy."
            exit 1
          fi

      # Scatto statico del corpus per chi visita con la sola password (senza
      # token personale) — vedi scripts/build-corpus-snapshot.ts. Legge
      # src/data/corpus/ dal checkout locale (fonte di verità, vedi
      # README.md) e genera public/corpus-snapshot.json, che `vite build`
      # copia poi in dist/.
      - run: npx tsx scripts/build-corpus-snapshot.ts

      # Solo `vite build`: la build statica non include server.ts (Express
      # non gira su GitHub Pages, vedi src/lib/apiShim.ts per l'equivalente
      # client-side delle route API).
      - run: npx vite build
        env:
          VITE_STATIC_BUILD: "true"
          VITE_SITE_PASSWORD_HASH: ${{ secrets.SITE_PASSWORD_HASH }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
