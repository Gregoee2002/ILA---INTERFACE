# tasks.yaml — Backlog per esecuzione autonoma con Claude Code (headless)
# Progetto: ILA / MENISKOS
#
# REGOLE GENERALI (valgono per ogni task, ripetute anche nel prompt runtime):
#   - MAI modificare file .xml del corpus (cartella corpus/ o equivalente) — questi
#     restano di esclusiva revisione manuale in Oxygen XML Editor.
#   - MAI modificare <xenoData> in qualsiasi contesto.
#   - MAI abilitare o toccare GITHUB_ALLOW_DELETE.
#   - MAI eseguire git push, git push --force, git checkout main, npm publish,
#     comandi di delete permanente.
#   - Ogni task lavora su un branch dedicato auto/task-<id>, creato da main
#     aggiornato, e produce SOLO commit locali.
#   - Se la build/typecheck fallisce dopo le modifiche, il task va marcato
#     "failed" e il branch NON va cancellato (serve per debug).
#   - status: pending | running | done | failed | skipped
#   - risk: low | medium | high  (lo script di default esegue solo low/medium
#     in modalità unattended; gli "high" richiedono lancio esplicito manuale)

tasks:
  - id: 001
    title: "Checklist di validazione completezza entry"
    area: frontend
    risk: low
    status: pending
    scope:
      - src/components/**
      - src/lib/validation/**
    prompt: >
      Crea un componente React TestDataPanel-style chiamato ValidationChecklist.tsx
      che, per ogni entry caricata (usando entryId, mai firebaseId), segnali in
      un pannello laterale se mancano: blocco <xenoData><iconography>, coordinate
      Pleiades, _section derivabile, indici onomastici derivati. NON modificare
      alcun file XML del corpus: leggi solo i dati già parsati lato client/server.
      Calcola un "completeness score" percentuale per entry. Segui lo stile
      glassmorphism/dark del design system esistente (vedi altri componenti in
      src/components per convenzioni Tailwind v4).

  - id: 002
    title: "Diff viewer XML (versione generata vs corretta)"
    area: frontend
    risk: medium
    status: done
    scope:
      - src/components/**
      - src/lib/diff/**
    prompt: >
      Implementa un componente XmlDiffViewer.tsx che mostri un diff riga per riga
      tra due stringhe XML EpiDoc (es. versione originale generata e versione
      dopo revisione manuale in Oxygen). Usa una libreria di diffing leggera
      (es. 'diff' via npm, valuta prima se già presente in package.json).
      Il componente è SOLO di visualizzazione: non deve scrivere né modificare
      alcun file XML, non deve interagire con githubStorage.ts. Prende in input
      due stringhe già caricate a monte.

  - id: 003
    title: "Densità storica sopra la timeline"
    area: frontend
    risk: low
    status: pending
    scope:
      - src/components/Timeline*
    prompt: >
      Estendi il componente Timeline esistente (lane-packing già implementato)
      aggiungendo un istogramma di densità (conteggio iscrizioni per secolo)
      renderizzato sopra la timeline principale, stesso asse temporale. Deriva
      i conteggi dai dati già presenti in memoria (date parsate), senza toccare
      la logica di lane-packing esistente né file XML.

  - id: 004
    title: "Vista comparativa 'Confronto stele' (side-by-side)"
    area: frontend
    risk: medium
    status: pending
    scope:
      - src/components/**
    prompt: >
      Crea un componente StelaCompare.tsx che permetta di selezionare due entry
      (via entryId) dalla catalogo esistente e mostrarle affiancate: immagine,
      testo edito, traduzione, apparato critico. Riusa i componenti di rendering
      del testo epigrafico già esistenti invece di duplicarli. Nessuna scrittura
      su file, solo lettura/visualizzazione.

  - id: 005
    title: "Export citazione bibliografica per entry"
    area: backend
    risk: low
    status: pending
    scope:
      - server.ts
      - src/lib/citation/**
    prompt: >
      Aggiungi un endpoint Express GET /api/entries/:entryId/citation che generi
      una citazione bibliografica standard (es. "CMRDM nr. X" + eventuali
      concordanze TAM V / SEG se presenti nei metadati dell'entry) in formato
      testo semplice e JSON. Leggi SOLO metadati già presenti nel documento
      EpiDoc (non inventare concordanze mancanti: se il dato non c'è, il campo
      va omesso, mai fabbricato — principio cardine del progetto). Non
      modificare alcun file XML.

  - id: 006
    title: "Statistiche automatiche per capitolo di tesi"
    area: backend
    risk: low
    status: pending
    scope:
      - server.ts
      - src/lib/stats/**
    prompt: >
      Aggiungi un endpoint GET /api/stats/summary che restituisca conteggi
      aggregati (per _section/regione, per periodo, per epiteto derivato dagli
      indici automatici) in JSON, pensati per essere incollati in tabelle di
      tesi. Aggiungi anche un piccolo pannello frontend con bottone "Genera
      tabella" che mostri i dati in una tabella HTML copiabile. Nessuna
      scrittura sui dati sorgente.

  - id: 007
    title: "Network graph relazioni onomastiche"
    area: backend+frontend
    risk: high
    status: pending
    scope:
      - src/lib/onomastics/**
      - src/components/**
    prompt: >
      Costruisci un grafo (nodi = persone via persName, archi = relazioni
      dichiarate come patronimico/parentela quando esplicitamente marcate nel
      testo) derivato ESCLUSIVAMENTE da markup <persName> già presente nelle
      edizioni (stesso principio di extractIndexSuggestions/
      applyDerivedIndices). Non inferire relazioni non esplicite nel testo.
      Componente di visualizzazione read-only, nessuna scrittura su XML.
      Segnalato come rischio alto: la logica di inferenza delle relazioni va
      rivista a mano prima del merge.

  - id: 008
    title: "Layer mappa colorato per epiteto"
    area: frontend
    risk: low
    status: pending
    scope:
      - src/components/*Map*
    prompt: >
      Estendi il componente Leaflet esistente aggiungendo un toggle che colora
      i marker per epiteto di Men (Axiottenos, Askaenos, Tyrannos, etc.)
      derivato dagli indici automatici già disponibili (epiteti derivati da
      persName), con legenda. Non introdurre nuove fonti dati, non toccare
      XML.

  - id: 009
    title: "API pubblica read-only (bozza)"
    area: backend
    risk: medium
    status: pending
    scope:
      - server.ts
      - src/lib/publicApi/**
    prompt: >
      Prepara una bozza di router Express separato (public-api.ts) con
      endpoint read-only versionati (/api/v1/entries, /api/v1/entries/:id)
      pensati per un futuro consumo esterno (progetto LARES/EAGLE). Solo
      GET, nessuna scrittura, nessuna autenticazione richiesta per ora
      (verrà aggiunta manualmente prima della pubblicazione). Documenta con
      commenti che questo router NON è ancora montato in produzione.

  - id: 010
    title: "GitHub Actions: type-check e validazione XML in CI"
    area: infra
    risk: medium
    status: pending
    scope:
      - .github/workflows/**
    prompt: >
      Crea un workflow GitHub Actions (.github/workflows/ci.yml) che ad ogni
      push/PR esegua: npm run typecheck (o tsc --noEmit se non presente uno
      script dedicato) e una validazione XML di base (well-formedness) sui
      file in corpus/ tramite un parser XML standard, SENZA modificare i file
      XML stessi — solo lettura per validazione. Fallisce la build se un file
      XML non è well-formed o se il typecheck fallisce.
